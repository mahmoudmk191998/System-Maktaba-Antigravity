<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>نظام ألوان للمكتبات والقرطاسية | Alwan Retail ERP</title>
  <meta name="description" content="نظام ألوان المتكامل لإدارة المكتبات والقرطاسية والطباعة - نقاط البيع، المخزون، الحسابات العامة، والمزيد" />
  <meta name="author" content="Alwan Retail ERP" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#07111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MK Library" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/mk-library-192-v2.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/mk-library-192-v2.png" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    // Capture Chromium's one-shot PWA install event as early as possible.
    // React may load after Chrome has already emitted beforeinstallprompt,
    // especially on Android. Keeping it on window prevents that race.
    window.__MK_PWA_INSTALL_PROMPT__ = null;
    window.__MK_PWA_INSTALLABLE__ = false;

    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__MK_PWA_INSTALL_PROMPT__ = event;
      window.__MK_PWA_INSTALLABLE__ = true;
      window.dispatchEvent(new CustomEvent('mk:pwa-install-ready'));
    });

    window.addEventListener('appinstalled', function () {
      window.__MK_PWA_INSTALL_PROMPT__ = null;
      window.__MK_PWA_INSTALLABLE__ = false;
      window.dispatchEvent(new CustomEvent('mk:pwa-install-consumed'));
    });
  </script>

  <meta property="og:title" content="نظام ألوان للمكتبات والقرطاسية | Alwan Retail ERP" />
  <meta property="og:description" content="نظام متكامل لإدارة المكتبات والقرطاسية والطباعة والمخزون والحسابات" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/icons/mk-library-512-v2.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/icons/mk-library-512-v2.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
          // Check immediately for a newer worker after deploys.
          registration.update().catch(() => {});
          console.log('SW registered:', registration.scope);
        } catch (registrationError) {
          console.error('SW registration failed:', registrationError);
        }
      });
    }
  </script>
</body>

</html>
