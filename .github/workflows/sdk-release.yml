name: SDK Release & Publish Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'sdk-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing to npm)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release & Publish @rms/sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rms-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@rms'

      - name: Install dependencies
        run: npm ci || npm install

      - name: 1. Validate Semantic Version & Tag Alignment
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PACKAGE_VERSION"
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
            EXPECTED_TAG_V="v$PACKAGE_VERSION"
            EXPECTED_TAG_SDK="sdk-v$PACKAGE_VERSION"

            if [ "$TAG_NAME" != "$EXPECTED_TAG_V" ] && [ "$TAG_NAME" != "$EXPECTED_TAG_SDK" ]; then
              echo "❌ Error: Git tag '$TAG_NAME' does not match package.json version '$PACKAGE_VERSION'"
              exit 1
            fi
            echo "✅ Git tag '$TAG_NAME' matches package.json version '$PACKAGE_VERSION'"
          fi

      - name: 2. Check for Duplicate npm Version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION="${{ steps.version_check.outputs.package_version }}"
          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION is already published on npm..."
          
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --silent > /dev/null 2>&1; then
            echo "❌ Error: Version $PACKAGE_VERSION of $PACKAGE_NAME is already published on npm!"
            echo "Please bump the version in packages/rms-sdk/package.json before releasing."
            exit 1
          else
            echo "✅ Version $PACKAGE_VERSION is available for release."
          fi

      - name: 3. Run Quality Gates (Lint & Typecheck)
        run: npm run lint

      - name: 4. Run SDK Test Suite
        run: npm test

      - name: 5. Build Distribution Artifacts
        run: npm run build

      - name: 6. Run Secret & Credential Scanning
        run: npm run audit:secrets

      - name: 7. Run Package Contents Audit
        run: npm run audit:package

      - name: 8. Package Dry-Run Verification
        run: npm pack --dry-run

      - name: 9. Publish to npm (Trusted Publishing / OIDC)
        if: ${{ !inputs.dry_run }}
        run: |
          echo "🚀 Publishing @rms/sdk to npm with provenance..."
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 10. Create GitHub Release
        if: ${{ !inputs.dry_run && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "@rms/sdk v${{ steps.version_check.outputs.package_version }}"
          body_path: packages/rms-sdk/CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
